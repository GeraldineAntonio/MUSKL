name: muskl
description: MUSKL - rutinas de ejercicio y asistencia para socios del gimnasio.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  file_picker: ^10.3.3
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  pdfrx: ^2.6.5
  video_player: '>=2.9.5 <2.15.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash.jpg
    - assets/images/splash_loading.jpg
    - assets/images/goals/
    - assets/audio/applause.wav
