name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'muskl/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: muskl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build installable APK
        run: flutter build apk --release --dart-define=MUSKL_API_URL=https://muskl-api.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: MUSKL-Android
          path: muskl/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
