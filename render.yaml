services:
  - type: web
    name: muskl-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MUSKL_ENV
        value: production
  - type: web
    name: muskl-media-web
    runtime: static
    plan: free
    buildCommand: cd media-web && npm ci && npm run build
    staticPublishPath: ./media-web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
